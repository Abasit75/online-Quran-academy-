<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamster Clicker Game</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0b2b2b,#021515);
color:white;
text-align:center;
}

h1{
margin-top:30px;
color:#ffd36a;
}

.game{
margin-top:50px;
}

.hamster{
font-size:120px;
cursor:pointer;
transition:0.1s;
user-select:none;
display:inline-block;
}

.hamster:active{
transform:scale(0.9);
}

.score{
font-size:30px;
margin-top:20px;
color:#00ffb3;
}

.btn{
margin-top:20px;
padding:10px 20px;
background:#ffd36a;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.shop{
margin-top:40px;
background:white;
color:black;
display:inline-block;
padding:20px;
border-radius:12px;
}

</style>
</head>

<body>

<h1>🐹 Hamster Clicker Game</h1>

<div class="game">

<div class="score">Coins: <span id="score">0</span></div>

<div class="hamster" onclick="clickHamster()">🐹</div>

<br>

<button class="btn" onclick="buyUpgrade()">Upgrade (+1 per click) - Cost: <span id="cost">10</span></button>

</div>

<div class="shop">
<h3>Upgrade System</h3>
<p>Every upgrade increases coins per click</p>
</div>

<script>

let score = 0;
let perClick = 1;
let cost = 10;

function clickHamster(){
score += perClick;
document.getElementById("score").innerText = score;
}

function buyUpgrade(){

if(score >= cost){
score -= cost;
perClick += 1;
cost += 10;

document.getElementById("score").innerText = score;
document.getElementById("cost").innerText = cost;

alert("Upgrade Purchased!");
}else{
alert("Not enough coins!");
}

}

</script>

</body>
</html>
