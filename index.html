<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Quran Academy System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

body{background:#032b2b;color:white;}

/* LOGIN */
.login{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.login-box{
background:white;
color:black;
padding:30px;
border-radius:15px;
width:300px;
}

input,button{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#d4a64a;
border:none;
font-weight:bold;
cursor:pointer;
}

/* APP */
.app{display:none;}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 5%;
background:#011818;
}

.logo{color:#d4a64a;font-weight:700;}

.logout{
background:red;
color:white;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

/* HERO */
.hero{
padding:50px 5%;
text-align:center;
}

.hero h1{font-size:40px;}
.hero span{color:#d4a64a;}

/* FORM */
.form{
background:white;
color:black;
max-width:600px;
margin:30px auto;
padding:20px;
border-radius:15px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

/* BUTTON */
.del{
background:red;
color:white;
padding:5px 8px;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="login" id="loginPage">
<h2>Admin Login</h2>
<div class="login-box">
<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">Login</button>
<p style="font-size:12px;">Hint: admin / 1234</p>
</div>
</div>

<!-- MAIN APP -->
<div class="app" id="app">

<header>
<div class="logo">☪ Quran Academy Admin Panel</div>
<div class="logout" onclick="logout()">Logout</div>
</header>

<div class="hero">
<h1>Welcome <span>Admin</span></h1>
<p>Student registrations & management system</p>
</div>

<!-- REGISTRATION FORM -->
<div class="form">
<h3>Student Registration</h3>

<input type="text" id="name" placeholder="Name">
<input type="text" id="number" placeholder="WhatsApp Number">

<select id="course">
<option>Qaida</option>
<option>Quran Reading</option>
</select>

<button onclick="addStudent()">Save Student</button>

</div>

<!-- TABLE -->
<div class="form">
<h3>Students List</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>Number</th>
<th>Course</th>
<th>Action</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

</div>

<script>

/* LOGIN */
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==="admin" && p==="1234"){
document.getElementById("loginPage").style.display="none";
document.getElementById("app").style.display="block";
loadData();
}else{
alert("Wrong login!");
}
}

/* LOGOUT */
function logout(){
location.reload();
}

/* SAVE DATA */
function addStudent(){

let name=document.getElementById("name").value;
let number=document.getElementById("number").value;
let course=document.getElementById("course").value;

if(name==="" || number===""){
alert("Fill all fields");
return;
}

let data=JSON.parse(localStorage.getItem("students")) || [];

data.push({name,number,course});

localStorage.setItem("students",JSON.stringify(data));

document.getElementById("name").value="";
document.getElementById("number").value="";

loadData();
}

/* LOAD DATA */
function loadData(){

let data=JSON.parse(localStorage.getItem("students")) || [];

let table="";

data.forEach((item,index)=>{
table+=`
<tr>
<td>${item.name}</td>
<td>${item.number}</td>
<td>${item.course}</td>
<td><button class="del" onclick="del(${index})">Delete</button></td>
</tr>
`;
});

document.getElementById("list").innerHTML=table;
}

/* DELETE */
function del(i){
let data=JSON.parse(localStorage.getItem("students")) || [];
data.splice(i,1);
localStorage.setItem("students",JSON.stringify(data));
loadData();
}

</script>

</body>
</html>
