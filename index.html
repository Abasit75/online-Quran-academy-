<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Quran Academy</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b2b2b;
color:white;
}

/* HEADER */
header{
background:#011818;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:#d4a64a;
font-weight:bold;
font-size:18px;
}

nav a{
color:white;
text-decoration:none;
margin:0 10px;
font-size:14px;
}

nav a:hover{color:#d4a64a;}

/* HERO */
.hero{
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:40px;
margin-bottom:10px;
}

.hero span{
color:#d4a64a;
}

.btn{
display:inline-block;
padding:10px 20px;
margin:10px;
background:#d4a64a;
color:black;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

/* SECTIONS */
section{
padding:40px 20px;
text-align:center;
}

.card{
background:white;
color:black;
padding:20px;
margin:10px;
border-radius:10px;
display:inline-block;
width:200px;
}

/* CONTACT */
input,textarea{
width:90%;
padding:10px;
margin:10px 0;
border-radius:5px;
border:none;
}

button{
padding:10px 20px;
background:#d4a64a;
border:none;
font-weight:bold;
cursor:pointer;
}

/* FOOTER */
footer{
background:#011818;
text-align:center;
padding:20px;
margin-top:30px;
}
</style>

</head>

<body>

<header>
<div class="logo">☪ Quran Academy</div>

<nav>
<a href="#">Home</a>
<a href="#courses">Courses</a>
<a href="#contact">Contact</a>
</nav>
</header>

<!-- HERO -->
<div class="hero">
<h1>Learn Quran <span>Online</span></h1>
<p>Simple and easy Quran learning for kids and adults</p>
<a class="btn" href="#contact">Enroll Now</a>
</div>

<!-- COURSES -->
<section id="courses">
<h2>Our Courses</h2>

<div class="card">Noorani Qaida</div>
<div class="card">Quran Reading</div>
<div class="card">Tajweed</div>

</section>

<!-- CONTACT -->
<section id="contact">
<h2>Contact Us</h2>

<input type="text" placeholder="Your Name">
<br>
<input type="text" placeholder="WhatsApp Number">
<br>
<textarea placeholder="Message"></textarea>
<br>
<button onclick="send()">Send</button>
</section>

<footer>
© 2026 Quran Academy
</footer>

<script>
function send(){
alert("Message sent successfully!");
}
</script>

</body>
</html>
